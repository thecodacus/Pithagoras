name: Build and publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

# A push while an image is still being built replaces that build. Left to finish, it could
# be the last to push and leave `latest` on the older commit.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing is published that the tests have not passed: the jobs of test.yml, as a pull request runs them.
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The image is built from the Dockerfile alone, which installs and builds the app itself.
      # No dependency's install script runs on the runner, where the token below is.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Actions that are not GitHub's own are pinned to a commit: a tag can be moved, and these run
      # with the token that can publish the image. The comment names the release.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
