name: Deploy docs

on:
  push:
    branches: [main]
    # Only when the docs or the workflow itself change — a server-only commit
    # has nothing to publish.
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

# Publishing is a deployment, not a build: let a run in progress finish rather
# than cancelling it half way through swapping the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # pages: write here is not for deploying — it lets configure-pages turn
    # Pages on by itself, so a fresh clone of this repo publishes without
    # anyone visiting the settings screen first. The token that proves who is
    # deploying (id-token) is the deploy job's alone: this one runs npm.
    permissions:
      contents: read
      pages: write
    steps:
      # The whole history, which is where a page's "Last updated" comes from.
      # The checkout's token is not kept in .git/config for the install scripts to find.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      # Project pages serve from /<repository name>/, spelled as the repository
      # is: the paths are case-sensitive, and a fork has a name of its own.
      - run: npm run docs:build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
