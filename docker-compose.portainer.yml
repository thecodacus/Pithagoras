# Portainer stack — pulls the prebuilt image, no build step.
# Set the environment variables in Portainer's stack UI.
services:
  pithagoras:
    # A release, such as 0.2.0, rather than latest: going back is setting it to the one before.
    image: ghcr.io/thecodacus/pithagoras:${PITHAGORAS_VERSION:-latest}
    container_name: pithagoras
    restart: unless-stopped
    network_mode: host
    volumes:
      - pithagoras-data:/data
      # Workspaces the agent may work in.
      - ${WORKSPACES_DIR:-/root/repos}:/workspaces
      # Required for managed Browser/Voice add-ons and EXECUTOR=container.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Must match container_name: managed voice shares this network namespace,
      # and the container executor translates its mounts to host paths through it.
      PORTAL_CONTAINER_NAME: pithagoras
      # With host networking the portal binds PORT directly on the host.
      PORT: ${PORT:-4100}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:?required}
      PORTAL_SECRET: ${PORTAL_SECRET:-}
      EXECUTOR: ${EXECUTOR:-host}
      PI_IMAGE: ${PI_IMAGE:-pithagoras-runner:latest}
      TASK_MEMORY_MB: ${TASK_MEMORY_MB:-2048}
      TASK_CPUS: ${TASK_CPUS:-2}
      TASK_PIDS_LIMIT: ${TASK_PIDS_LIMIT:-512}
      # Left empty so pi's own settings.json decides; pinning a provider here
      # is what put these examples out of step with the runtime.
      PI_PROVIDER: ${PI_PROVIDER:-}
      PI_MODEL: ${PI_MODEL:-}
      PI_THINKING_LEVEL: ${PI_THINKING_LEVEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Managed voice, when more than one GPU is in the box: the GPU index it uses
      # (as nvidia-smi lists them), and memory in MiB to keep free on it for
      # something else. Left empty, the card with the most room is used.
      VOICE_GPU: ${VOICE_GPU:-}
      VOICE_VRAM_RESERVE_MIB: ${VOICE_VRAM_RESERVE_MIB:-}

volumes:
  pithagoras-data:
